server:
  port: 8082

spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${PAYMENT_DB_USER:payments}
    password: ${PAYMENT_DB_PASSWORD:payments}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Test-mode dispatch adapter (spec section 3). "direct" is production behaviour.
# "controlled" enables fault injection and the /_stateverdict control API: never in production.
stateverdict:
  dispatch:
    mode: ${STATEVERDICT_DISPATCH_MODE:direct}
