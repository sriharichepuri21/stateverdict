server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${ORDER_DB_USER:orders}
    password: ${ORDER_DB_PASSWORD:orders}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Test-mode dispatch adapter (spec section 3). "direct" is production behaviour.
# "controlled" enables fault injection and the /_stateverdict control API: never in production.
stateverdict:
  dispatch:
    mode: ${STATEVERDICT_DISPATCH_MODE:direct}

# How payment outcomes are applied: "guarded" (default, correct) or "naive" (deliberately
# overwrites cancelled orders; for demonstrating StateVerdict only).
order:
  completion:
    handler: ${ORDER_COMPLETION_HANDLER:guarded}

# Evaluation only: deliberately altered behaviour for the defect corpus (docs/evaluation/corpus.md).
evaluation:
  mutation: ${EVALUATION_MUTATION:}
