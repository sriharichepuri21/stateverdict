name: ci

# Every pull request: build, unit and integration tests, and the hand-written regression schedules
# (fixed scenarios, repeated 10 times each). Randomized exploration and shrinking are slower and
# not deterministic, so they run in exploration.yml (nightly and on demand) instead.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run all tests
        run: mvn -B verify
      - name: Report test counts (and fail if no tests ran)
        if: always()
        run: |
          shopt -s globstar nullglob
          reports=(**/target/surefire-reports/TEST-*.xml)
          tests=0; failures=0; errors=0; skipped=0
          for f in "${reports[@]}"; do
            line=$(grep -m1 -o '<testsuite[^>]*>' "$f")
            get() { echo "$line" | grep -o " $1=\"[0-9]*\"" | grep -o '[0-9]*'; }
            tests=$((tests + $(get tests))); failures=$((failures + $(get failures)))
            errors=$((errors + $(get errors))); skipped=$((skipped + $(get skipped)))
          done
          summary="${tests} tests, ${failures} failures, ${errors} errors, ${skipped} skipped (${#reports[@]} test classes)"
          echo "::notice title=Test results::${summary}"
          echo "### Test results: ${summary}" >> "$GITHUB_STEP_SUMMARY"
          [ "$tests" -gt 0 ] || { echo "::error::No tests ran"; exit 1; }
          # Name every failing test, with the first line of its message, so a red build explains itself.
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  problem = case.find("failure") if case.find("failure") is not None else case.find("error")
                  if problem is not None:
                      name = case.get("classname").rsplit(".", 1)[-1] + "." + case.get("name")
                      detail = (problem.get("message") or problem.text or "").strip().splitlines()
                      detail = " ".join(line.strip() for line in detail[:6]).replace("%", "%25")[:900]
                      print(f"::error title=Failing test {name}::{detail}")
          PY

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the StateVerdict CLI
        run: mvn -B -q -pl apps/stateverdict-core -am package -DskipTests
      - name: Start the full stack
        run: docker compose -f infrastructure/compose/docker-compose.yml up --build -d --wait
      - name: Both services report healthy
        run: scripts/wait-healthy.sh 8081 8082
      - name: One order produces exactly one committed capture
        run: scripts/checkout-smoke.sh
      - name: Controlled duplicate delivery is journaled
        run: scripts/duplicate-delivery-demo.sh
      - name: "StateVerdict: baseline (no fault) must PASS"
        run: |
          java -jar apps/stateverdict-core/target/stateverdict-core-*.jar \
            run checkout-duplicate-payment-request --copies 1 --report artifacts/baseline.json
      - name: "StateVerdict: duplicate delivery against the naive handler must FAIL"
        run: |
          set +e
          java -jar apps/stateverdict-core/target/stateverdict-core-*.jar \
            run checkout-duplicate-payment-request --copies 2 --report artifacts/duplicate.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "::error::expected FAIL (exit 1), got exit $code"; exit 1; fi
          echo "::notice title=StateVerdict::duplicate delivery -> FAIL (SV-002 violated), as expected for the naive handler"
      - name: "StateVerdict: replaying the saved evidence reproduces FAIL"
        run: |
          set +e
          java -jar apps/stateverdict-core/target/stateverdict-core-*.jar replay-evidence artifacts/duplicate.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "::error::expected replay FAIL (exit 1), got exit $code"; exit 1; fi
      - name: "StateVerdict: naive handler, 10 clean-state trials each (duplicate must FAIL)"
        run: scripts/measure-reproduction.sh 10 naive
      - name: "Schedules, naive handlers: cancel race must FAIL (SV-003) on 10/10 trials"
        run: |
          scripts/measure-schedule.sh scenarios/checkout-baseline.json 10 PASS baseline-schedule-naive
          scripts/measure-schedule.sh scenarios/cancel-while-payment-completion-held.json 10 FAIL cancel-race-naive
          scripts/measure-schedule.sh scenarios/concurrent-duplicate-payment-request.json 10 FAIL concurrent-duplicate-naive
      - name: Switch the payment service to the idempotent handler
        run: |
          PAYMENT_CAPTURE_HANDLER=idempotent \
            docker compose -f infrastructure/compose/docker-compose.yml up -d --wait payment-service
          docker compose -f infrastructure/compose/docker-compose.yml exec -T payment-service \
            printenv PAYMENT_CAPTURE_HANDLER | grep -qx idempotent
          scripts/wait-healthy.sh 8082
      - name: "StateVerdict: idempotent handler, 10 clean-state trials each (duplicate must PASS)"
        run: scripts/measure-reproduction.sh 10 idempotent
      - name: "Idempotent handler: duplicate delivery demo shows 2 deliveries, 1 capture"
        run: |
          output=$(scripts/duplicate-delivery-demo.sh)
          echo "$output"
          grep -q "1 capture (the handler is idempotent)" <<< "$output"
      - name: Switch the order service to the guarded completion handler
        run: |
          ORDER_COMPLETION_HANDLER=guarded PAYMENT_CAPTURE_HANDLER=idempotent \
            docker compose -f infrastructure/compose/docker-compose.yml up -d --wait order-service
          docker compose -f infrastructure/compose/docker-compose.yml exec -T order-service \
            printenv ORDER_COMPLETION_HANDLER | grep -qx guarded
          scripts/wait-healthy.sh 8081
      - name: "Schedules, fixed handlers: every schedule must PASS on 10/10 trials"
        run: |
          scripts/measure-schedule.sh scenarios/checkout-baseline.json 10 PASS baseline-schedule-fixed
          scripts/measure-schedule.sh scenarios/duplicate-payment-request.json 10 PASS duplicate-schedule-fixed
          scripts/measure-schedule.sh scenarios/concurrent-duplicate-payment-request.json 10 PASS concurrent-duplicate-fixed
          scripts/measure-schedule.sh scenarios/cancel-while-payment-completion-held.json 10 PASS cancel-race-fixed
      - id: report1
        name: Upload StateVerdict reports
        if: always()
        uses: actions/upload-artifact@v5
        # A failed upload (GitHub's artifact service) must not fail a green build.
        continue-on-error: true
        with:
          name: stateverdict-reports
          path: artifacts/
          if-no-files-found: ignore
      - name: Warn if the report upload failed
        if: always() && steps.report1.outcome == 'failure'
        run: echo "::warning title=Report not uploaded::stateverdict-reports could not be uploaded (GitHub artifact service). The verdicts above are unaffected; these reports are diagnostics, not published evidence."
      - name: Service logs
        if: always()
        run: docker compose -f infrastructure/compose/docker-compose.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f infrastructure/compose/docker-compose.yml down -v

  one-command-demo:
    name: One-command demo (Docker only)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Run scripts/demo.sh exactly as a new developer would
        run: |
          set -o pipefail
          mkdir -p artifacts
          scripts/demo.sh 2>&1 | tee artifacts/demo-transcript.txt
      - name: Publish the transcript to the job summary
        if: always()
        run: |
          {
            echo '### scripts/demo.sh transcript'
            echo '```'
            cat artifacts/demo-transcript.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Also as annotations, so the key output is readable from the run page and API.
          encode() { python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          step2=$(sed -n '/^2\/4/,/^Exit code/p' artifacts/demo-transcript.txt | grep -v '^=*$' | head -40 | encode)
          echo "::notice title=Demo step 2 output::${step2}"
          summary=$(sed -n '/^Summary/,$p' artifacts/demo-transcript.txt | grep -v '^=*$' | encode)
          echo "::notice title=Demo summary::${summary}"
      - id: report2
        name: Upload demo reports
        if: always()
        uses: actions/upload-artifact@v5
        # A failed upload (GitHub's artifact service) must not fail a green build.
        continue-on-error: true
        with:
          name: demo-reports
          path: artifacts/
          if-no-files-found: ignore
      - name: Warn if the report upload failed
        if: always() && steps.report2.outcome == 'failure'
        run: echo "::warning title=Report not uploaded::demo-reports could not be uploaded (GitHub artifact service). The verdicts above are unaffected; these reports are diagnostics, not published evidence."

  external-target:
    name: "External target: hand-written regression schedules"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the StateVerdict CLI
        run: mvn -B -q -pl apps/stateverdict-core -am package -DskipTests
      - name: Fetch the target at its pinned commit, apply the adapter, build it
        run: targets/piomin-saga/prepare.sh
      - name: Start the patched target
        run: docker compose -f targets/piomin-saga/docker-compose.yml up -d --wait broker && docker compose -f targets/piomin-saga/docker-compose.yml up -d
      - name: Wait until the target decides an order end to end
        run: targets/piomin-saga/wait-ready.sh
      - name: "Measure every schedule, 10 clean-state trials each"
        run: targets/piomin-saga/measure.sh 10
      - id: report3
        name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        # A failed upload (GitHub's artifact service) must not fail a green build.
        continue-on-error: true
        with:
          name: piomin-saga-reports
          path: artifacts/
          if-no-files-found: ignore
      - name: Warn if the report upload failed
        if: always() && steps.report3.outcome == 'failure'
        run: echo "::warning title=Report not uploaded::piomin-saga-reports could not be uploaded (GitHub artifact service). The verdicts above are unaffected; these reports are diagnostics, not published evidence."
      - name: Service logs
        if: always()
        run: docker compose -f targets/piomin-saga/docker-compose.yml logs --no-color | tail -400
      - name: Stop the target
        if: always()
        run: docker compose -f targets/piomin-saga/docker-compose.yml down -v
