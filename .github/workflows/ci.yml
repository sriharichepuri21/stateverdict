name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run all tests
        run: mvn -B verify

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Start the full stack
        run: docker compose -f infrastructure/compose/docker-compose.yml up --build -d --wait
      - name: Both services report healthy
        run: |
          for port in 8081 8082; do
            for attempt in $(seq 1 30); do
              if curl -fsS "http://localhost:${port}/actuator/health" | grep -q '"status":"UP"'; then
                echo "service on ${port} is UP"; continue 2
              fi
              sleep 2
            done
            echo "service on ${port} never became healthy"; exit 1
          done
      - name: Service logs
        if: always()
        run: docker compose -f infrastructure/compose/docker-compose.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f infrastructure/compose/docker-compose.yml down -v
