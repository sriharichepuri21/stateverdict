name: evaluation

# Head-to-head on the defect corpus (docs/evaluation/corpus.md): for every configuration, run the
# conventional JUnit/Testcontainers suite and StateVerdict, then tabulate who detected what.
on:
  # The head-to-head explores generated schedules for every corpus configuration (about 35 minutes
  # of parallel jobs), so it runs after merging, nightly and on demand rather than on every PR.
  push:
    branches: [main]
    paths: ["apps/**", "examples/**", "libs/**", "scenarios/**", "scripts/**", ".github/workflows/evaluation.yml"]
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: "Evaluate ${{ matrix.config }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        config: [baseline, M01, M02, M03, M04, M05, M06, C01, C02, C03]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run both approaches against ${{ matrix.config }}
        run: scripts/evaluate-config.sh ${{ matrix.config }}
      - name: Upload evidence
        id: up1
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: eval-${{ matrix.config }}
          path: artifacts/eval/
          if-no-files-found: ignore
      - name: Upload evidence (retry)
        if: always() && steps.up1.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: eval-${{ matrix.config }}
          path: artifacts/eval/
          if-no-files-found: ignore
          overwrite: true

  summarise:
    name: Summarise the head-to-head
    needs: evaluate
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: eval-*
          path: eval
          merge-multiple: true
      - name: Build the results table
        run: |
          # Each job uploads its whole folder (explore reports too); keep only the per-config results.
          jq -s 'map(select(type == "object" and has("config") and has("junit")))
                 | sort_by(.config | if . == "baseline" then "0" else . end)' eval/*.json > results.json
          echo "configurations: $(jq 'length' results.json)"
          if [ "$(jq 'length' results.json)" -ne 10 ]; then
            # Missing evidence for any configuration: record the run as incomplete and do not publish it.
            python3 scripts/record-evidence.py evaluation incomplete . record.json "only $(jq 'length' results.json) of 10 configuration results" || true
            scripts/publish-evidence.sh record.json evaluation
            echo "::error title=Evidence incomplete::expected 10 configuration results. This run's figures must not be published or cited."
            exit 1
          fi
          jq -r '
            def mark(kind; detected):
              if kind == "defect" then (if detected then "caught" else "MISSED" end)
              else (if detected then "FALSE ALARM" else "quiet" end) end;
            "| Config | Kind | Conventional suite | StateVerdict |",
            "|---|---|---|---|",
            (.[] | "| \(.config) | \(.kind) | \(mark(.kind; .junit.detected)): \(.junit.failed)/\(.junit.testsRun) tests failed | \(mark(.kind; .stateverdict.detected)): \(if (.stateverdict.rulesViolated | length) > 0 then (.stateverdict.rulesViolated | join(", ")) else "no rule violated" end)\(if .stateverdict.inconclusive > 0 then ", \(.stateverdict.inconclusive) inconclusive" else "" end) |")
          ' results.json > table.md
          cat table.md
          { echo "## Defect corpus: conventional suite vs StateVerdict"; echo; cat table.md; echo;
            echo "Failing conventional tests per configuration:"; echo '```';
            jq -r '.[] | "\(.config): \(.junit.failingTests | join(", "))"' results.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          table=$(python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\n","%0A"))' < table.md)
          echo "::notice title=Head-to-head results::${table}"
          tests=$(jq -r '.[] | "\(.config): \(.junit.failingTests | join(", "))"' results.json \
            | python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\n","%0A"))')
          echo "::notice title=Failing conventional tests::${tests}"
      - uses: actions/upload-artifact@v5
        with:
          name: evaluation-results
          path: |
            results.json
            table.md
      - name: Record the evidence on the evidence branch
        run: |
          python3 scripts/record-evidence.py evaluation complete . record.json
          scripts/publish-evidence.sh record.json evaluation
          echo "::notice title=Evidence recorded::runs/evaluation/${GITHUB_RUN_ID}.json on the evidence branch (citable)"
