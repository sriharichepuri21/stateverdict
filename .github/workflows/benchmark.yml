name: benchmark

# What the adapter costs an application when no fault is injected, measured two ways:
#   1. dispatcher: a JMH microbenchmark of one message through the dispatcher (nanoseconds)
#   2. external app: the unpatched external target against the same app with the adapter, in
#      production mode and in test mode, end to end (milliseconds)
# Runs when the measured code changes on main, and on request. On a pull request it runs only when
# the benchmark itself changes. The record is published to the evidence branch from main only.
on:
  push:
    branches: [main]
    paths:
      - "libs/**"
      - "benchmarks/**"
      - "targets/piomin-saga/adapter.patch"
      - "targets/piomin-saga/overhead.sh"
      - "scripts/analyze-overhead.py"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - "benchmarks/**"
      - "targets/piomin-saga/overhead.sh"
      - "scripts/analyze-overhead.py"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds (each runs all three configurations)
        default: "3"
      orders:
        description: Measured orders per run
        default: "300"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatcher:
    name: "Dispatcher: per-message cost (JMH)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      evidence: ${{ steps.up1.outcome == 'success' || steps.up2.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the benchmark
        run: |
          # On failure, the compiler's errors also become annotations, readable without the full log.
          mvn -B -Pbenchmarks -pl benchmarks/dispatch-overhead -am package -DskipTests > build.log 2>&1 || {
            grep -E '^\[ERROR\]' build.log | head -20 | while IFS= read -r line; do echo "::error title=Benchmark build::${line}"; done
            tail -60 build.log; exit 1; }
      - name: "Run: baseline, direct, controlled (3 forks x 10 one-second iterations each)"
        run: |
          mkdir -p artifacts/jmh
          java -jar benchmarks/dispatch-overhead/target/dispatch-benchmarks.jar -rf json -rff artifacts/jmh/jmh.json
          {
            echo "### Dispatcher: per-message cost, no fault armed"
            echo
            echo "| Benchmark | ns per message | ± (99.9% CI) |"
            echo "|---|---|---|"
            jq -r '.[] | "| \(.benchmark | split(".") | last) | \(.primaryMetric.score * 100 | round / 100) | \(.primaryMetric.scoreError * 100 | round / 100) |"' artifacts/jmh/jmh.json
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          jq -r '.[] | "::notice title=Dispatcher \(.benchmark | split(".") | last)::\(.primaryMetric.score * 100 | round / 100) ± \(.primaryMetric.scoreError * 100 | round / 100) ns per message (99.9% CI)"' artifacts/jmh/jmh.json
      - id: up1
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: benchmark-dispatcher
          path: artifacts/jmh/
      - id: up2
        if: steps.up1.outcome == 'failure'
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: benchmark-dispatcher
          path: artifacts/jmh/
          overwrite: true

  external:
    name: "External app: end-to-end latency with and without the adapter"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      evidence: ${{ steps.up1.outcome == 'success' || steps.up2.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the target twice, unpatched and with the adapter
        run: |
          targets/piomin-saga/prepare.sh --upstream
          targets/piomin-saga/prepare.sh
      - name: "Measure: upstream, adapter (production mode), adapter (test mode, no fault)"
        run: targets/piomin-saga/overhead.sh "${{ inputs.rounds || '3' }}" "${{ inputs.orders || '300' }}"
      - id: up1
        if: always()
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: benchmark-external
          path: artifacts/piomin-saga-overhead/
          if-no-files-found: ignore
      - id: up2
        if: always() && steps.up1.outcome == 'failure'
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: benchmark-external
          path: artifacts/piomin-saga-overhead/
          if-no-files-found: ignore
          overwrite: true
      - name: Stop the target
        if: always()
        run: docker compose -p stateverdict-overhead -f targets/piomin-saga/docker-compose.yml down -v

  record:
    name: Record the evidence
    needs: [dispatcher, external]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        if: needs.dispatcher.outputs.evidence == 'true'
        with:
          name: benchmark-dispatcher
          path: evidence/jmh
      - uses: actions/download-artifact@v5
        if: needs.external.outputs.evidence == 'true'
        with:
          name: benchmark-external
          path: evidence/overhead
      - name: Write the record and publish it to the evidence branch
        env:
          DISPATCHER_EVIDENCE: ${{ needs.dispatcher.outputs.evidence }}
          EXTERNAL_EVIDENCE: ${{ needs.external.outputs.evidence }}
        run: |
          status=complete; reason=""
          [ "${DISPATCHER_EVIDENCE}" = "true" ] || { status=incomplete; reason="dispatcher evidence was not uploaded"; }
          [ "${EXTERNAL_EVIDENCE}" = "true" ] || { status=incomplete; reason="${reason:+${reason}; }external app evidence was not uploaded"; }
          set +e
          python3 scripts/record-evidence.py benchmark "${status}" evidence record.json "${reason}"
          citable=$?
          set -e
          published=false
          if [ "${GITHUB_REF}" = refs/heads/main ]; then
            scripts/publish-evidence.sh record.json benchmark
            published=true
          else
            echo "Not main (${GITHUB_REF}): record not published"; cat record.json
          fi
          if [ "${citable}" -ne 0 ]; then
            echo "::error title=Evidence incomplete::$(jq -r .reason record.json). This run's figures must not be published or cited."
            exit 1
          fi
          if [ "${published}" = true ]; then
            echo "::notice title=Evidence recorded::runs/benchmark/${GITHUB_RUN_ID}.json on the evidence branch (citable)"
          else
            echo "::notice title=Evidence not published::complete, but this run is not on main, so its figures must not be cited"
          fi
