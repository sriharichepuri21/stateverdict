name: exploration

# Randomized exploration and shrinking: generated schedules (seed 42), then one finding per rule
# shrunk to a minimal schedule and confirmed over 10 runs. Not run on every pull request: it takes
# about an hour, and a seed reproduces the generated schedules, not the exact timing of their
# execution, so counts can differ slightly between runs. Fast, fixed regression schedules run in ci.yml.
on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: Generated schedules per campaign
        default: "60"
      seed:
        description: Seed
        default: "42"

permissions:
  contents: read

concurrency:
  group: exploration
  cancel-in-progress: false

env:
  ITERATIONS: ${{ inputs.iterations || '60' }}
  SEED: ${{ inputs.seed || '42' }}

jobs:
  commerce:
    name: "Commerce example: explore and shrink"
    runs-on: ubuntu-24.04
    outputs:
      evidence: ${{ steps.up1.outcome == 'success' || steps.up2.outcome == 'success' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the StateVerdict CLI
        run: mvn -B -q -pl apps/stateverdict-core -am package -DskipTests
      - name: Start the stack with the naive handlers
        run: docker compose -f infrastructure/compose/docker-compose.yml up --build -d --wait && scripts/wait-healthy.sh 8081 8082
      - name: "Explore, naive handlers: must find SV-002 and SV-003"
        run: scripts/explore.sh naive "${ITERATIONS}" "${SEED}" FAIL SV-002 SV-003
      - name: "Shrink findings and confirm each over 10 runs"
        run: scripts/shrink-findings.sh artifacts/explore-naive.json
      - name: Switch to the fixed handlers
        run: |
          ORDER_COMPLETION_HANDLER=guarded PAYMENT_CAPTURE_HANDLER=idempotent \
            docker compose -f infrastructure/compose/docker-compose.yml up -d --wait order-service payment-service
          scripts/wait-healthy.sh 8081 8082
      - name: "Explore, fixed handlers: the same schedules must find nothing"
        run: scripts/explore.sh fixed "${ITERATIONS}" "${SEED}" PASS
      # Benchmark evidence is not optional: try twice, and report the outcome to the record job,
      # which refuses to publish figures from a run whose evidence is missing.
      - name: Upload evidence
        id: up1
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: exploration-commerce
          path: artifacts/
          if-no-files-found: ignore
      - name: Upload evidence (retry)
        id: up2
        if: always() && steps.up1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: exploration-commerce
          path: artifacts/
          if-no-files-found: ignore
          overwrite: true
      - name: Stop the stack
        if: always()
        run: docker compose -f infrastructure/compose/docker-compose.yml down -v

  external:
    name: "External target: explore and shrink"
    runs-on: ubuntu-24.04
    outputs:
      evidence: ${{ steps.up1.outcome == 'success' || steps.up2.outcome == 'success' }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the StateVerdict CLI
        run: mvn -B -q -pl apps/stateverdict-core -am package -DskipTests
      - name: Fetch the target at its pinned commit, apply the adapter, build it
        run: targets/piomin-saga/prepare.sh
      - name: Start the patched target
        run: docker compose -f targets/piomin-saga/docker-compose.yml up -d --wait broker && docker compose -f targets/piomin-saga/docker-compose.yml up -d
      - name: Wait until the target decides an order end to end
        run: targets/piomin-saga/wait-ready.sh
      - name: Explore generated schedules and shrink one finding per kind
        run: targets/piomin-saga/explore-and-shrink.sh "${ITERATIONS}" "${SEED}"
      # Benchmark evidence is not optional: try twice, and report the outcome to the record job,
      # which refuses to publish figures from a run whose evidence is missing.
      - name: Upload evidence
        id: up1
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: exploration-external
          path: artifacts/
          if-no-files-found: ignore
      - name: Upload evidence (retry)
        id: up2
        if: always() && steps.up1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: exploration-external
          path: artifacts/
          if-no-files-found: ignore
          overwrite: true
      - name: Stop the target
        if: always()
        run: docker compose -f targets/piomin-saga/docker-compose.yml down -v

  record:
    name: Record the evidence
    needs: [commerce, external]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        if: needs.commerce.outputs.evidence == 'true'
        with:
          name: exploration-commerce
          path: evidence/commerce
      - uses: actions/download-artifact@v5
        if: needs.external.outputs.evidence == 'true'
        with:
          name: exploration-external
          path: evidence/external
      - name: Write the record and publish it to the evidence branch
        env:
          COMMERCE_EVIDENCE: ${{ needs.commerce.outputs.evidence }}
          EXTERNAL_EVIDENCE: ${{ needs.external.outputs.evidence }}
          COMMERCE_RESULT: ${{ needs.commerce.result }}
          EXTERNAL_RESULT: ${{ needs.external.result }}
        run: |
          status=complete; reason=""
          [ "${COMMERCE_EVIDENCE}" = "true" ] || { status=incomplete; reason="commerce evidence was not uploaded"; }
          [ "${EXTERNAL_EVIDENCE}" = "true" ] || { status=incomplete; reason="${reason:+${reason}; }external evidence was not uploaded"; }
          for r in "commerce:${COMMERCE_RESULT}" "external:${EXTERNAL_RESULT}"; do
            [ "${r#*:}" = success ] || { status=incomplete; reason="${reason:+${reason}; }${r%%:*} job ${r#*:}"; }
          done
          set +e
          python3 scripts/record-evidence.py exploration "${status}" evidence record.json "${reason}"
          citable=$?
          set -e
          scripts/publish-evidence.sh record.json exploration
          if [ "${citable}" -ne 0 ]; then
            echo "::error title=Evidence incomplete::$(jq -r .reason record.json). This run's figures must not be published or cited; the last citable run stays in runs/exploration/latest.json on the evidence branch."
            exit 1
          fi
          echo "::notice title=Evidence recorded::runs/exploration/${GITHUB_RUN_ID}.json on the evidence branch (citable)"
